name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests examples
          ruff format --check src tests examples

      - name: Test
        run: pytest --tb=short

      - name: Run examples
        run: |
          python examples/01_raices.py
          python examples/02_interpolacion.py
          python examples/03_integracion.py
          python examples/04_sistemas.py
          python examples/05_edo.py
          python examples/06_ajuste.py
